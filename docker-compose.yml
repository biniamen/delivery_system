name: creavers-delivery

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
    volumes:
      - creavers-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - creavers-network

  api:
    build:
      context: .
      dockerfile: backend/src/Creavers.Delivery.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__InitializeAndSeed: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?configure JWT_SIGNING_KEY in .env}
      DemoAccounts__CustomerPassword: ${CUSTOMER_DEMO_PASSWORD:?configure CUSTOMER_DEMO_PASSWORD in .env}
      DemoAccounts__DispatcherPassword: ${DISPATCHER_DEMO_PASSWORD:?configure DISPATCHER_DEMO_PASSWORD in .env}
      DemoAccounts__DriverPassword: ${DRIVER_DEMO_PASSWORD:?configure DRIVER_DEMO_PASSWORD in .env}
      DemoAccounts__StoreAdminPassword: ${STORE_ADMIN_DEMO_PASSWORD:?configure STORE_ADMIN_DEMO_PASSWORD in .env}
      GoogleMaps__Enabled: ${GOOGLE_MAPS_ENABLED:-false}
      GoogleMaps__ServerApiKey: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      GoogleMaps__BrowserApiKey: ${GOOGLE_MAPS_BROWSER_API_KEY:-}
      GoogleMaps__MapId: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - creavers-network

  dispatcher-portal:
    build:
      context: .
      dockerfile: frontend/dispatcher-portal/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:8080"
    networks:
      - creavers-network

volumes:
  creavers-postgres-data:

networks:
  creavers-network:
    driver: bridge
