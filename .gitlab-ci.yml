stages:
  - test
  - build

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

backend-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore backend/Creavers.Delivery.slnx
    - dotnet test backend/Creavers.Delivery.slnx --configuration Release --no-restore
  cache:
    key: nuget
    paths:
      - .nuget/packages/

frontend-tests:
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.19.0 --activate
    - cd frontend/dispatcher-portal
    - pnpm install --frozen-lockfile
  script:
    - pnpm test
  cache:
    key:
      files:
        - frontend/dispatcher-portal/pnpm-lock.yaml
    paths:
      - frontend/dispatcher-portal/.pnpm-store/

frontend-build:
  stage: build
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.19.0 --activate
    - cd frontend/dispatcher-portal
    - pnpm install --frozen-lockfile
  script:
    - pnpm build:production
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/dispatcher-portal/dist/
